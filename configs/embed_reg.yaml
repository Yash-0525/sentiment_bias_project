# PHASE 10 — Embedding Regularization (curriculum Step 3A)
# Paper WikiText-103: λ ∈ {1, 10, 100}, lr 2.5e-5, 25k steps, batch 32
# Student: start from Phase 5 baseline, fewer steps, same loss formula

run_name: embedding_reg
mode: embedding              # embedding | sentiment
model_name: gpt2
baseline_dir: models/baseline/best/hf_model
f_sh_path: null              # unused for embedding mode
data_dir: data/wikitext103/processed
seq_len: 256
seed: 42

# loss: L = L_LM(x) + lambda * (1 - cos(h_bar(x), h_bar(x̃)))
# L_LM on UNPERTURBED x only (paper p.70)
lambda_fair: 10              # override via CLI for {1,10,100}
lr: 2.5e-5                   # paper Step-3 lr (10× lower than their Step-1)
weight_decay: 0.01
betas: [0.9, 0.999]
max_grad_norm: 1.0
warmup_steps: 50

micro_batch_size: 2          # CF doubles forward cost
grad_accum_steps: 8          # effective batch 16
max_steps: 1000
log_every: 20
eval_every: 250
save_every: 250
# Checkpoints: weights only (no Adam optimizer blob) — see train_debias.py

# only sequences flagged has_sensitive=true (paper Step 3)
sensitive_only: true
max_train_sequences: null
max_val_sequences: 200
num_workers: 0
resume: true
